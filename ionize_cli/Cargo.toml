[package]
name = "ionize_cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
description = "Render ion graphs provided as json as svg from the CLI"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "ionize"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ionize = { package = "ionize_core", version = "0.1", path = "../ionize_core" }
ionize_draw = { version = "0.1", path = "../ionize_draw", features = ["std"] }
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
