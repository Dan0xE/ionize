[workspace]
members = ["ionize_core", "ionize_draw", "ionize_cli"]
default-members = ["ionize_core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
strip = "none"
incremental = false
